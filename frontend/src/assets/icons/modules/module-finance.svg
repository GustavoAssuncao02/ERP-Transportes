<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ícone financeiro">
  <title>Ícone financeiro</title>

  <!-- Barras do gráfico -->
  <rect x="104" y="304" width="64" height="96" fill="#000000"/>
  <rect x="224" y="240" width="64" height="160" fill="#000000"/>
  <rect x="344" y="168" width="64" height="232" fill="#000000"/>

  <!-- Base do gráfico -->
  <rect x="80" y="400" width="352" height="28" rx="4" fill="#000000"/>

  <!-- Linha de crescimento -->
  <polyline points="112,272 208,192 272,240 392,120" stroke="#000000" stroke-width="32" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Seta -->
  <polygon points="372,96 440,88 432,156" fill="#000000"/>

  <!-- Símbolo de dólar -->
  <text x="112" y="188" fill="#000000" font-size="140" font-family="Arial, Helvetica, sans-serif" font-weight="700">$</text>
</svg>
