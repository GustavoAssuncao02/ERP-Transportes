<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexo ERP - Tela Principal</title>
  <style>
    /* =============================================
       DESIGN SYSTEM (extraído do PDF como JSON)
       {
         "colors": {
           "primary": "#1a7a72",
           "primaryDark": "#155f59",
           "accent": "#f5a623",
           "accentOrange": "#e87722",
           "background": "#f0f0f0",
           "surface": "#ffffff",
           "navbarBg": "#1a7a72",
           "navbarText": "#ffffff",
           "tabActiveBg": "#ffffff",
           "tabActiveBorder": "#1a7a72",
           "tabInactiveBg": "#e8e8e8",
           "tabInactiveText": "#555555",
           "textPrimary": "#1a1a1a",
           "textSecondary": "#555555",
           "border": "#d0d0d0",
           "cardBg": "#ffffff",
           "cardBorder": "#cccccc",
           "headerBar": "#f8f8f8",
           "headerBorder": "#cccccc",
           "logoTextTeal": "#1a7a72",
           "logoBg": "#1a5f5a",
           "logoAccent1": "#f5a623",
           "logoAccent2": "#e87722",
           "logoAccent3": "#ffffff"
         },
         "typography": {
           "fontFamily": "'Segoe UI', system-ui, sans-serif",
           "brandFont": "bold",
           "navFontSize": "14px",
           "tabFontSize": "13px",
           "sectionTitleSize": "15px",
           "headerInfoSize": "13px"
         },
         "spacing": {
           "navbarHeight": "52px",
           "tabBarHeight": "42px",
           "contentPadding": "24px 32px",
           "sectionGap": "32px",
           "cardRadius": "8px",
           "cardGap": "12px"
         },
         "components": {
           "navbar": "teal background, white text, dropdown menus, logo left, user info right",
           "tabs": "browser-style tabs with active/inactive states, close button on non-home tabs",
           "quickAccessCards": "5 per row, tall rectangular cards with rounded corners, bordered",
           "quickQueryCards": "5 per row, shorter cards, 2 rows, rounded corners, bordered",
           "sidebar": "right side, white bg, Vexo logo centered with hexagon icon and brand text"
         }
       }
    ============================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1a7a72;
      --primary-dark: #155f59;
      --accent: #f5a623;
      --accent-orange: #e87722;
      --bg: #efefef;
      --surface: #ffffff;
      --nav-text: #ffffff;
      --tab-active-bg: #ffffff;
      --tab-inactive-bg: #e2e2e2;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #cccccc;
      --card-radius: 8px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── TOP HEADER BAR ── */
    .header-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 52px;
      gap: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 16px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    /* ── NAVBAR ── */
    .navbar {
      background: var(--primary);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 0;
    }

    .nav-logo {
      width: 36px;
      height: 36px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .nav-items {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 0;
    }

    .nav-item {
      color: var(--nav-text);
      font-size: 14px;
      font-weight: 500;
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      border: none;
      background: none;
      text-decoration: none;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.12);
    }

    .nav-item svg {
      width: 13px;
      height: 13px;
      opacity: 0.85;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0;
      margin-left: auto;
    }

    .nav-info {
      color: var(--nav-text);
      font-size: 13px;
      padding: 0 14px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 1px solid rgba(255,255,255,0.2);
    }

    .nav-info svg {
      width: 16px;
      height: 16px;
      opacity: 0.85;
    }

    .nav-logout {
      color: var(--nav-text);
      padding: 0 14px;
      height: 52px;
      display: flex;
      align-items: center;
      cursor: pointer;
      border-left: 1px solid rgba(255,255,255,0.2);
      transition: background 0.15s;
    }

    .nav-logout:hover {
      background: rgba(255,255,255,0.12);
    }

    .nav-logout svg {
      width: 20px;
      height: 20px;
    }

    /* ── TAB BAR ── */
    .tab-bar {
      background: var(--bg);
      display: flex;
      align-items: flex-end;
      padding: 8px 0 0 0;
      border-bottom: 1px solid var(--border);
      gap: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      height: 36px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      margin-left: 6px;
      white-space: nowrap;
      transition: background 0.1s;
    }

    .tab.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
      border-bottom-color: var(--surface);
      margin-bottom: -1px;
      z-index: 1;
    }

    .tab.inactive {
      background: var(--tab-inactive-bg);
      color: var(--text-muted);
    }

    .tab.inactive:hover {
      background: #d8d8d8;
    }

    .tab-icon {
      width: 14px;
      height: 14px;
      color: var(--primary);
    }

    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.1s;
    }

    .tab-close:hover {
      background: rgba(0,0,0,0.12);
      color: var(--text);
    }

    /* ── MAIN LAYOUT ── */
    .main-layout {
      display: flex;
      min-height: calc(100vh - 52px - 45px);
    }

    .content-area {
      flex: 1;
      padding: 28px 36px;
    }

    .sidebar {
      width: 300px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── SECTION ── */
    .section {
      margin-bottom: 36px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .section-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 18px;
    }

    /* ── CARDS ── */
    .cards-grid {
      display: grid;
      gap: 12px;
    }

    .cards-grid-5 {
      grid-template-columns: repeat(5, 1fr);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-color: #aaa;
    }

    .card-tall {
      height: 140px;
    }

    .card-short {
      height: 68px;
    }

    /* ── SIDEBAR LOGO ── */
    .sidebar-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .hexagon-logo {
      width: 160px;
      height: 160px;
    }

    .vexo-brand-text {
      font-size: 52px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -2px;
      line-height: 1;
    }

    .erp-label {
      font-size: 14px;
      color: #888;
      letter-spacing: 2px;
      font-weight: 500;
      border-top: 1px solid #ccc;
      padding-top: 10px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
